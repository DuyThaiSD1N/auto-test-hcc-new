# Render Blueprint - dung khi tao service bang "New > Blueprint"
# Doc them: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: auto-test-hcc
    runtime: docker
    plan: free            # doi thanh starter khi can chay 24/7 (free se ngu sau 15 phut)
    region: singapore     # gan Viet Nam nhat
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true      # push len nhanh chinh la tu deploy
    envVars:
      # Render tu sinh chuoi ngau nhien, khong can tu dat
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_DEFAULT_USERNAME
        value: admin
      # sync: false = Render se hoi gia tri khi tao service, khong luu vao git
      - key: APP_DEFAULT_PASSWORD
        sync: false
      - key: APP_DEFAULT_FULL_NAME
        value: Quan tri vien
      - key: APP_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: APP_BATCH_API_BASE_URL
        value: https://trolyhoso-hcc-admin.vnekyc.vn
      # Secret goi API boc tach - nhap trong dashboard, khong luu vao git
      - key: APP_BATCH_API_SECRET
        sync: false
      # Nguon boc tach: batch (mac dinh) hoac internal (BE noi bo phai truy cap duoc tu Render)
      - key: APP_EXTRACT_PROVIDER
        value: batch
      - key: APP_INTERNAL_API_BASE_URL
        sync: false
      - key: APP_INTERNAL_USERNAME
        sync: false
      - key: APP_INTERNAL_PASSWORD
        sync: false
      # Render khong co MongoDB dung san: dung chuoi ket noi ben ngoai (vd MongoDB Atlas).
      # De trong thi ung dung van chay, chi khong luu lich su.
      - key: APP_MONGO_URI
        sync: false
      - key: APP_MONGO_DB
        value: auto_test_hcc
