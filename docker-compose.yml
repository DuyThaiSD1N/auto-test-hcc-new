services:
  app:
    build: .
    image: auto-test-hcc:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # BAT BUOC doi truoc khi chay that: openssl rand -hex 32
      APP_SECRET_KEY: ${APP_SECRET_KEY:?can dat APP_SECRET_KEY trong file .env}
      APP_DEFAULT_USERNAME: ${APP_DEFAULT_USERNAME:-admin}
      APP_DEFAULT_PASSWORD: ${APP_DEFAULT_PASSWORD:?can dat APP_DEFAULT_PASSWORD trong file .env}
      APP_DEFAULT_FULL_NAME: ${APP_DEFAULT_FULL_NAME:-Quan tri vien}
      APP_ACCESS_TOKEN_EXPIRE_MINUTES: ${APP_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      APP_BATCH_API_BASE_URL: ${APP_BATCH_API_BASE_URL:-https://trolyhoso-hcc-admin.vnekyc.vn}
      APP_BATCH_API_SECRET: ${APP_BATCH_API_SECRET:-}
      # Doc van ban OCR cua ho so batch tu Mongo cua Auto Fill HCC (tuy chon)
      APP_OCR_CACHE_MONGO_URI: ${APP_OCR_CACHE_MONGO_URI:-}
      APP_OCR_CACHE_DB: ${APP_OCR_CACHE_DB:-autofill_hcc}
      APP_EXTRACT_PROVIDER: ${APP_EXTRACT_PROVIDER:-batch}
      APP_INTERNAL_API_BASE_URL: ${APP_INTERNAL_API_BASE_URL:-}
      APP_INTERNAL_USERNAME: ${APP_INTERNAL_USERNAME:-}
      APP_INTERNAL_PASSWORD: ${APP_INTERNAL_PASSWORD:-}
      APP_INTERNAL_CONCURRENCY: ${APP_INTERNAL_CONCURRENCY:-2}
      # Tai khoan admin cua BE noi bo - chi de doc van ban OCR (/api/v1/traces)
      APP_INTERNAL_ADMIN_USERNAME: ${APP_INTERNAL_ADMIN_USERNAME:-}
      APP_INTERNAL_ADMIN_PASSWORD: ${APP_INTERNAL_ADMIN_PASSWORD:-}
      APP_MONGO_URI: ${APP_MONGO_URI:-mongodb://mongo:27017}
      APP_MONGO_DB: ${APP_MONGO_DB:-auto_test_hcc}
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Khong mo cong ra ngoai: chi container app trong cung mang moi goi duoc.
    # Can xem truc tiep bang Compass thi them:  ports: ["27018:27017"]

volumes:
  mongo-data:
